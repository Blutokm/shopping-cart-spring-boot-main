<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Đặt hàng thành công</title>
</head>
<body>
	<section>
		<div class="container mt-5 p-5 text-center">
			<i class="fa-solid fa-circle-check fa-5x text-success mb-3"></i>
			<h3 class="text-success">Đặt hàng thành công!</h3>
			<p>Cảm ơn đã mua hàng,chúc bạn may mắn lần sau</p>

			<!-- Bang hoa don -->
			<div class="card mt-4">
				<div class="card-body text-start">
					<p>
						<strong>Mã đơn hàng:</strong> <span th:text="${orderId}"></span>
					</p>
					<p>
						<strong>Tên Khách hàng:</strong> <span th:text="${user.name}"></span>
					</p>
					<p>
						<strong>Email:</strong> <span th:text="${user.email}"></span>
					</p>
					<p>
						<strong>Phương thức thanh toán:</strong> <span
							th:text="${paymentType}"></span>
					</p>
				</div>
			</div>

	

			<div class="mt-4">
				<a href="/" class="btn btn-primary me-2">Trang chủ</a> <a
					href="/user/user-orders" class="btn btn-success">Xem đơn hàng</a>
			</div>
		</div>
	</section>
</body>
</html>
