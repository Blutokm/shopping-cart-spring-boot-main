<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Bảng điều khiển Quản trị</title>
</head>
<body>
<section class="py-5">

    <!-- PHẦN THỐNG KÊ -->
    <div class="container mb-5">
        <div class="row text-center g-4">
            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="card p-3 bg-success text-white">
                    <h5>Doanh thu</h5>
                    <h3 th:text="${#numbers.formatDecimal(revenue, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></h3>
                </div>
            </div>
            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="card p-3 bg-warning text-dark">
                    <h5>Đơn hàng</h5>
                    <h3 th:text="${orders}"></h3>
                </div>
            </div>
            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="card p-3 bg-info text-white">
                    <h5>Sản phẩm</h5>
                    <h3 th:text="${products}"></h3>
                </div>
            </div>
            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="card p-3 bg-secondary text-white">
                    <h5>Người dùng</h5>
                    <h3 th:text="${users}"></h3>
                </div>
            </div>
        </div>
    </div>

    <hr class="my-5">

    <!-- PHẦN MENU -->
    <div class="container">
        <div class="row g-4 justify-content-center">

            <div class="col-lg-4 col-md-6 col-sm-12">
                <a href="/admin/category" class="text-decoration-none">
                    <div class="card card-sh h-100">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-warning">
                            <i class="fa-solid fa-list fa-3x mb-3"></i>
                            <h4>Thêm Danh mục</h4>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-lg-4 col-md-6 col-sm-12">
                <a href="/admin/loadAddProduct" class="text-decoration-none">
                    <div class="card card-sh h-100">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-primary">
                            <i class="fa-solid fa-square-plus fa-3x mb-3"></i>
                            <h4>Thêm Sản phẩm</h4>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-lg-4 col-md-6 col-sm-12">
                <a href="/admin/products" class="text-decoration-none">
                    <div class="card card-sh h-100">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-success">
                            <i class="fa-solid fa-table-list fa-3x mb-3"></i>
                            <h4>Xem Sản phẩm</h4>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-lg-4 col-md-6 col-sm-12">
                <a href="/admin/orders" class="text-decoration-none">
                    <div class="card card-sh h-100">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-warning">
                            <i class="fa-solid fa-box-open fa-3x mb-3"></i>
                            <h4>Đơn hàng</h4>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-lg-4 col-md-6 col-sm-12">
                <a href="/admin/users?type=1" class="text-decoration-none">
                    <div class="card card-sh h-100">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-primary">
                            <i class="fa-solid fa-circle-user fa-3x mb-3"></i>
                            <h4>Người dùng</h4>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-lg-4 col-md-6 col-sm-12">
                <a href="/admin/add-admin" class="text-decoration-none">
                    <div class="card card-sh h-100">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-primary">
                            <i class="fa-solid fa-user-plus fa-3x mb-3"></i>
                            <h4>Thêm Quản trị viên</h4>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-lg-4 col-md-6 col-sm-12">
                <a href="/admin/users?type=2" class="text-decoration-none">
                    <div class="card card-sh h-100">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-secondary">
                            <i class="fa-solid fa-user-shield fa-3x mb-3"></i>
                            <h4>Quản trị viên</h4>
                        </div>
                    </div>
                </a>
            </div>

        </div>
    </div>
</section>
</body>
</html>
