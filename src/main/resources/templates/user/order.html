<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Thanh toán đơn hàng</title>
</head>
<body>

	<section class="bg-light pb-5 pt-4">
		<div class="container">
			
			<a href="javascript:history.back()" class="text-decoration-none text-dark fw-medium mb-3 d-inline-block"> 
				<i class="fa-solid fa-arrow-left me-1"></i> Quay lại giỏ hàng
			</a>

			<div th:if="${errorMessage}" class="alert alert-danger shadow-sm border-0 d-flex align-items-center mb-4">
				<i class="fa-solid fa-circle-exclamation fs-4 me-2"></i>
				<span th:text="${errorMessage}"></span>
			</div>

			<form action="/user/save-order" method="post" id="orders" novalidate>
				<div class="row g-4">
					
					<div class="col-lg-7">
						<div class="card border-0 shadow-sm rounded-4 h-100">
							<div class="card-body p-4 p-md-5">
								<h4 class="fw-bold mb-4 border-bottom pb-3">
									<i class="fa-solid fa-location-dot text-brand me-2" style="color: var(--primary-color);"></i>
									Thông tin nhận hàng
								</h4>
								
								<div class="row g-3">
									<div class="col-md-6">
										<label class="form-label fw-medium text-muted small">Họ</label>
										<input type="text" name="firstName" required class="form-control form-control-lg bg-light">
									</div>
									<div class="col-md-6">
										<label class="form-label fw-medium text-muted small">Tên</label>
										<input type="text" name="lastName" required class="form-control form-control-lg bg-light">
									</div>
									
									<div class="col-md-6">
										<label class="form-label fw-medium text-muted small">Địa chỉ Email</label>
										<input type="email" name="email" required class="form-control form-control-lg bg-light">
									</div>
									<div class="col-md-6">
										<label class="form-label fw-medium text-muted small">Số điện thoại nhận hàng</label>
										<input type="tel" name="mobileNo" required class="form-control form-control-lg bg-light">
									</div>

									<div class="col-12">
										<label class="form-label fw-medium text-muted small">Địa chỉ cụ thể</label>
										<input type="text" name="address" required class="form-control form-control-lg bg-light" >
									</div>

									<div class="col-md-6">
										<label class="form-label fw-medium text-muted small">Tỉnh/Thành phố</label>
										<select name="city" id="city" class="form-select form-control-lg bg-light" required>
											<option value="" selected disabled hidden>-- Chọn Tỉnh/Thành phố --</option>
											<option value="Ha Noi">Hà Nội</option>
											<option value="TP Ho Chi Minh">TP Hồ Chí Minh</option>
											<option value="Da Nang">Đà Nẵng</option>
											<option value="Hai Phong">Hải Phòng</option>
											<option value="Can Tho">Cần Thơ</option>
											<option value="Hue">Huế</option>
											<option value="Binh Duong">Bình Dương</option>
											<option value="Dong Nai">Đồng Nai</option>
											<option value="Quang Ninh">Quảng Ninh</option>
											<option value="Khac">Khác</option>
										</select>
									</div>
									
									<div class="col-md-3">
										<label class="form-label fw-medium text-muted small">Quận/Huyện</label>
										<input type="text" name="state" required class="form-control form-control-lg bg-light">
									</div>
									<div class="col-md-3">
										<label class="form-label fw-medium text-muted small">Mã bưu chính (Zip)</label>
										<input type="number" name="pincode" required class="form-control form-control-lg bg-light">
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="col-lg-5">
						<div class="position-sticky" style="top: 80px;">
							
							<div class="card border-0 shadow-sm rounded-4 mb-4">
								<div class="card-body p-4">
									<h5 class="fw-bold mb-4">
										<i class="fa-solid fa-receipt text-brand me-2" style="color: var(--primary-color);"></i> 
										Tóm tắt đơn hàng
									</h5>
									
									<div class="order-products-preview mb-3 pb-2 border-bottom" style="max-height: 200px; overflow-y: auto;">
										<div th:each="item : ${carts}" class="d-flex align-items-center mb-3 pe-2">
											<div class="flex-shrink-0 border rounded-3 bg-white d-flex align-items-center justify-content-center overflow-hidden" style="width: 50px; height: 50px;">
												<img th:src="@{'/img/product_img/' + ${item.product.image}}" alt="Product" class="img-fluid" style="max-height: 100%; object-fit: contain;">
											</div>
											<div class="flex-grow-1 ms-3" style="min-width: 0;">
												<h6 class="text-dark small fw-semibold mb-0 text-truncate" th:text="${item.product.title}" th:title="${item.product.title}">Tên sản phẩm</h6>
												<small class="text-muted fs-7">
													Số lượng: <span class="fw-medium text-dark" th:text="${item.quantity}">1</span>
												</small>
											</div>
											<div class="text-end ms-2">
												<span class="small fw-bold text-dark" th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
											</div>
										</div>
									</div>

									<div class="d-flex justify-content-between mb-2">
										<span class="text-muted">Tạm tính:</span>
										<span class="fw-medium">
											<span th:text="${#numbers.formatDecimal(orderPrice, 0, 'COMMA', 0, 'POINT')}"></span>
											<th:block th:utext="${@commnServiceImpl.rupeeSign()}"></th:block>
										</span>
									</div>
									<div class="d-flex justify-content-between mb-2">
										<span class="text-muted">Phí vận chuyển:</span>
										<span class="fw-medium">
											<span th:text="${#numbers.formatDecimal(20000, 0, 'COMMA', 0, 'POINT')}"></span>
											<th:block th:utext="${@commnServiceImpl.rupeeSign()}"></th:block>
										</span>
									</div>
									<div class="d-flex justify-content-between mb-3 pb-3 border-bottom">
										<span class="text-muted">Thuế:</span>
										<span class="fw-medium">
											<span th:text="${#numbers.formatDecimal(350, 0, 'COMMA', 0, 'POINT')}"></span>
											<th:block th:utext="${@commnServiceImpl.rupeeSign()}"></th:block>
										</span>
									</div>
									<div class="d-flex justify-content-between align-items-center mt-3">
										<span class="fs-5 fw-bold text-dark">Tổng cộng:</span>
										<span class="fs-4 fw-bold" style="color: var(--price-color);">
											<span th:text="${#numbers.formatDecimal(totalOrderPrice, 0, 'COMMA', 0, 'POINT')}"></span>
											<th:block th:utext="${@commnServiceImpl.rupeeSign()}"></th:block>
										</span>
									</div>
									
									<input type="hidden" name="amount" th:value="${totalOrderPrice}" />
								</div>
							</div>

							<div class="card border-0 shadow-sm rounded-4">
								<div class="card-body p-4">
									<h5 class="fw-bold mb-3">Phương thức thanh toán</h5>
									
									<label class="payment-box d-flex align-items-center p-3 mb-3 border rounded-3 cursor-pointer selected" id="box-cod">
										<input class="form-check-input mt-0 me-3 custom-radio" type="radio" name="paymentType" id="cod" value="COD" checked>
										<div class="d-flex align-items-center">
											<div class="bg-light rounded p-2 me-3 text-success d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
												<i class="fa-solid fa-money-bill-wave fs-4"></i>
											</div>
											<div>
												<span class="d-block fw-bold">Thanh toán khi nhận hàng</span>
												<small class="text-muted">Thanh toán bằng tiền mặt khi giao hàng (COD)</small>
											</div>
										</div>
									</label>

									<label class="payment-box d-flex align-items-center p-3 border rounded-3 cursor-pointer" id="box-vnpay">
										<input class="form-check-input mt-0 me-3 custom-radio" type="radio" name="paymentType" id="vnpay" value="VNPAY">
										<div class="d-flex align-items-center">
											<div class="bg-light rounded p-2 me-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
												<img src="/img/vnpay/payment_3_img.png" alt="VNPay" class="img-fluid" style="max-height: 25px;">
											</div>
											<div>
												<span class="d-block fw-bold">Thanh toán trực tuyến VNPay</span>
												<small class="text-muted">Quét mã QR, Thẻ ATM nội địa, Thẻ quốc tế</small>
											</div>
										</div>
									</label>

									<button type="submit" class="btn btn-lg w-100 fw-bold mt-4 text-white shadow-sm transition-all" 
											style="background-color: var(--primary-color); border: none; padding: 14px 0; font-size: 1.1rem;">
										XÁC NHẬN ĐẶT HÀNG
									</button>
								</div>
							</div>

						</div>
					</div>
					
				</div>
			</form>
		</div>
	</section>

	<script>
	document.addEventListener("DOMContentLoaded", function() {
		const orderForm = document.getElementById("orders");
		
		const paymentBoxes = document.querySelectorAll('.payment-box');
		const radioButtons = document.querySelectorAll('input[name="paymentType"]');

		radioButtons.forEach(radio => {
			radio.addEventListener('change', function() {
				paymentBoxes.forEach(box => box.classList.remove('selected', 'border-primary'));
				if(this.checked) {
					this.closest('.payment-box').classList.add('selected', 'border-primary');
				}
			});
		});

		orderForm.addEventListener("submit", function(event) {
			const paymentType = document.querySelector('input[name="paymentType"]:checked').value;
			const totalAmount = document.querySelector('input[name="amount"]').value;
			const citySelect = document.getElementById("city");
			const selectedCity = citySelect.value;

			if (!selectedCity || selectedCity.trim() === "") {
				event.preventDefault();
				alert("Vui lòng chọn Tỉnh/Thành phố trước khi đặt hàng!");
				citySelect.focus();
				return;
			}

			if (paymentType === "VNPAY") {
				event.preventDefault();
				
				const btnSubmit = orderForm.querySelector('button[type="submit"]');
				btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Đang kết nối cổng VNPay...';
				btnSubmit.disabled = true;

				fetch("/create-payment", {
					method: "POST",
					headers: {
						"Content-Type": "application/x-www-form-urlencoded; charset=UTF-8"
					},
					body: "amount=" + encodeURIComponent(totalAmount)
				})
				.then(response => {
					if (!response.ok) throw new Error("Lỗi Kết Nối VNPay!");
					return response.text();
				})
				.then(url => {
					if (url.startsWith("http")) {
						window.location.href = url;
					} else {
						alert("Không nhận được URL thanh toán hợp lệ từ hệ thống!");
						btnSubmit.innerHTML = 'XÁC NHẬN ĐẶT HÀNG';
						btnSubmit.disabled = false;
					}
				})
				.catch(error => {
					console.error(error);
					alert("Không thể khởi tạo giao dịch VNPay. Vui lòng thử lại sau ít phút!");
					btnSubmit.innerHTML = 'XÁC NHẬN ĐẶT HÀNG';
					btnSubmit.disabled = false;
				});
			}
		});
	});
	</script>
</body>
</html>
