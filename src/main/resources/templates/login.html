<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
</head>
<body>
    <section>
        <div class="container mt-5 p-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
                        <div class="card-header text-center">
                            <p class="fs-4 fw-bold">Đăng nhập</p>
                            
                            <div th:if="${param.error}" class="alert alert-danger text-center py-2 mb-0 mt-2">
                                <th:block th:if="${session.SPRING_SECURITY_LAST_EXCEPTION!=null}">
                                    [[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]
                                </th:block>
                            </div>
                            
                            <div th:if="${param.logout}" class="alert alert-success text-center py-2 mb-0 mt-2">
                                Đăng xuất thành công
                            </div>
                        </div>

                        <div class="card-body">
                            <form action="/login" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-medium">Email</label>
                                    <input required class="form-control" name="username" type="email" placeholder="Nhập email">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-medium">Mật khẩu</label>
                                    <input required class="form-control" name="password" type="password" placeholder="Nhập mật khẩu">
                                </div>

                                <div class="mb-4 text-end">
                                    <a href="/forgot-password" class="text-decoration-none text-primary small fw-medium">
                                        <i class="fa-solid fa-key me-1"></i> Quên mật khẩu?
                                    </a>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 fw-bold">
                                    Đăng nhập
                                </button>
                            </form>
                        </div>

                        <div class="card-footer text-center bg-white border-top-0 pt-0 pb-3">
                            <span class="text-muted">Chưa có tài khoản?</span>
                            <a href="/register" class="text-decoration-none fw-bold text-primary ms-1">Đăng ký ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
