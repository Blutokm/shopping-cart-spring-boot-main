<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - ShopPKTH</title>
</head>
<body>
    <section>
        <div class="container mt-5 mb-5 p-3 p-md-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    
                    <div class="card shadow-lg border-0 rounded-4" style="border-top: 4px solid var(--primary-color) !important;">
                        
                        <div class="card-header bg-white border-0 text-center pt-4 pb-0">
                            <h3 class="fw-bold text-primary text-uppercase mb-1">Đăng Nhập</h3>
                            <p class="text-muted small">Chào mừng bạn quay lại với ShopPKTH</p>
                            
                            <div th:if="${param.error}" class="alert alert-danger text-center py-2 mb-3 mt-3 fw-semibold shadow-sm border-0 rounded-3">
                                <i class="fa-solid fa-circle-exclamation me-1"></i>
                                <th:block th:if="${session.SPRING_SECURITY_LAST_EXCEPTION!=null}">
                                    [[${session.SPRING_SECURITY_LAST_EXCEPTION.message}]]
                                </th:block>
                            </div>
                            
                            <div th:if="${param.logout}" class="alert alert-success text-center py-2 mb-3 mt-3 fw-semibold shadow-sm border-0 rounded-3">
                                <i class="fa-solid fa-circle-check me-1"></i> Đăng xuất thành công
                            </div>
                        </div>

                        <div class="card-body p-4 p-md-5 pt-md-3">
                            <form action="/login" method="post">
                                
                                <div class="mb-4">
                                    <label class="form-label fw-semibold text-secondary">
                                        <i class="fa-solid fa-envelope me-2"></i>Địa chỉ Email
                                    </label>
                                    <input required class="form-control bg-light px-3 py-2" name="username" type="email">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold text-secondary">
                                        <i class="fa-solid fa-lock me-2"></i>Mật khẩu
                                    </label>
                                    <input required class="form-control bg-light px-3 py-2" name="password" type="password">
                                </div>

                                <div class="mb-4 text-end">
                                    <a href="/forgot-password" class="text-decoration-none text-primary small fw-bold transition-all">
                                        Quên mật khẩu?
                                    </a>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase shadow-sm rounded-pill mb-2">
                                    <i class="fa-solid fa-right-to-bracket me-2"></i> Đăng nhập
                                </button>
                            </form>
                        </div>

                        <div class="card-footer text-center bg-white border-top-0 pt-0 pb-4">
                            <span class="text-muted">Chưa có tài khoản?</span>
                            <a href="/register" class="text-decoration-none fw-bold text-primary ms-1 transition-all">Đăng ký ngay</a>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
    </section>
</body>
</html>
