<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/base_admin::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Thêm Sản Phẩm</title>
</head>
<body>
	<section>
		<div class="container">
			<p class="text-center fs-3 mt-2">Thêm Sản Phẩm Mới</p>
			<div class="text-center mb-3">
				<th:block th:if="${session.succMsg}">
					<p class="text-success fw-bold">[[${session.succMsg}]]</p>
					<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
				</th:block>
				<th:block th:if="${session.errorMsg}">
					<p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
					<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
				</th:block>
			</div>

			<div class="row">
				<div class="col-md-10 offset-md-1">
					<div class="card shadow-sm">
						<div class="card-body p-4">
							<form action="/admin/saveProduct" method="post"
								enctype="multipart/form-data">
								<div class="mb-3">
									<label class="fw-semibold">Tên sản phẩm</label> <input
										type="text" name="title" class="form-control"
										placeholder="Nhập tên sản phẩm" required>
								</div>
								<div class="mb-3">
									<label class="fw-semibold">Mô tả</label>
									<textarea rows="4" name="description" class="form-control"
										placeholder="Nhập mô tả sản phẩm..." required></textarea>
								</div>
								<div class="mb-3">
									<label class="fw-semibold">Danh mục</label> <select
										class="form-control" name="category" required>
										<option value="">--Chọn--</option>
										<option th:each="c:${categories}" th:value="${c.name}"
											th:text="${c.name}"></option>
									</select>
								</div>
								<div class="mb-3">
									<label class="fw-semibold">Giá (VNĐ)</label> <input
										type="number" name="price" class="form-control"
										placeholder="Nhập giá sản phẩm" required>
								</div>

								<div class="card mb-3 border-info">
									<div
										class="card-header bg-info text-white fw-bold d-flex justify-content-between align-items-center">
										Phân loại sản phẩm (Màu sắc, Size, Tồn kho)
										<button type="button"
											class="btn btn-sm btn-light text-dark fw-bold"
											onclick="addVariantRow()">+ Thêm phân loại</button>
									</div>
									<div class="card-body p-2">
										<table class="table table-bordered mb-0" id="variantsTable">
											<thead class="table-light">
												<tr>
													<th>Màu sắc</th>
													<th>Size</th>
													<th>Tồn kho</th>
													<th class="text-center">Xóa</th>
												</tr>
											</thead>
											<tbody>
												<tr>
													<td><input type="text" name="colors"
														class="form-control form-control-sm"
														placeholder="VD: Đen, Trắng, Đỏ..." required></td>
													<td><select name="sizes"
														class="form-control form-control-sm" required>
															<option value="S">S</option>
															<option value="M">M</option>
															<option value="L">L</option>
															<option value="XL">XL</option>
															<option value="Free Size">Free Size</option>
													</select></td>
													<td><input type="number" name="stocks" min="0"
														class="form-control form-control-sm"
														placeholder="Số lượng" required></td>
													<td class="text-center"><button type="button"
															class="btn btn-sm btn-danger"
															onclick="removeVariantRow(this)">
															<i class="fa-solid fa-trash"></i>
														</button></td>
												</tr>
											</tbody>
										</table>
									</div>
								</div>
								<div class="mb-3">
									<label class="fw-semibold">Trạng thái</label><br>
									<div class="form-check form-check-inline">
										<input class="form-check-input" type="radio" name="isActive"
											id="active" value="true" checked> <label
											class="form-check-label" for="active">Kích hoạt</label>
									</div>
									<div class="form-check form-check-inline">
										<input class="form-check-input" type="radio" name="isActive"
											id="inactive" value="false"> <label
											class="form-check-label" for="inactive">Ngừng kích
											hoạt</label>
									</div>
								</div>
								<div class="mb-3">
									<label>Ảnh chính sản phẩm</label> <input type="file"
										name="file" class="form-control" required>
								</div>

								<div class="mb-3">
									<label>Ảnh phụ bổ sung (Chọn nhiều ảnh)</label> <input
										type="file" name="extraImageFiles" class="form-control"
										multiple>
								</div>
								<div class="text-center">
									<button class="btn btn-primary px-5 py-2">Lưu sản phẩm</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script>
			function addVariantRow() {
				const tbody = document.querySelector("#variantsTable tbody");
				const tr = document.createElement("tr");
				tr.innerHTML = `
					<td><input type="text" name="colors" class="form-control form-control-sm" placeholder="VD: Đen..." required></td>
					<td>
						<select name="sizes" class="form-control form-control-sm" required>
							<option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="Free Size">Free Size</option>
						</select>
					</td>
					<td><input type="number" name="stocks" min="0" class="form-control form-control-sm" placeholder="Số lượng" required></td>
					<td class="text-center"><button type="button" class="btn btn-sm btn-danger" onclick="removeVariantRow(this)"><i class="fa-solid fa-trash"></i></button></td>
				`;
				tbody.appendChild(tr);
			}

			function removeVariantRow(button) {
				const row = button.closest("tr");
				if(document.querySelectorAll("#variantsTable tbody tr").length > 1) {
					row.remove();
				} else {
					alert("Phải có ít nhất 1 phân loại sản phẩm!");
				}
			}
		</script>
	</section>
</body>
</html>
