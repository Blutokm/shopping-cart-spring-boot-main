<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/base_admin::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Chỉnh sửa danh mục - ShopPKTH</title>
</head>
<body>
	<section>
		<div class="container-fluid px-4 mt-4 mb-5">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary text-uppercase mb-1">Chỉnh sửa danh mục</h3>
                <p class="text-muted">Cập nhật thông tin và hình ảnh danh mục sản phẩm</p>
            </div>

			<div class="row justify-content-center">
				<div class="col-md-8 col-lg-6">
					<div class="card shadow-sm border-0 rounded-4" style="border-top: 4px solid var(--primary-color) !important;">
						<div class="card-body p-4 p-md-5">
                            
                            <div class="text-center mb-4">
                                <th:block th:if="${session.succMsg}">
                                    <div class="alert alert-success py-2 fw-semibold shadow-sm border-0 rounded-3">
                                        <i class="fa-solid fa-circle-check me-1"></i> [[${session.succMsg}]]
                                    </div>
                                    <th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
                                </th:block>

                                <th:block th:if="${session.errorMsg}">
                                    <div class="alert alert-danger py-2 fw-semibold shadow-sm border-0 rounded-3">
                                        <i class="fa-solid fa-circle-exclamation me-1"></i> [[${session.errorMsg}]]
                                    </div>
                                    <th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
                                </th:block>
                            </div>

							<form action="/admin/updateCategory" method="post" enctype="multipart/form-data">
								<input type="hidden" name="id" th:value="${category.id}">

                                <div class="mb-4 text-center">
                                    <label class="form-label fw-semibold text-secondary d-block mb-3">Ảnh hiện tại</label>
                                    <img th:src="@{'/img/category_img/'+${category.imageName}}" 
                                         class="rounded-circle border shadow-sm p-1" 
                                         style="width: 120px; height: 120px; object-fit: cover;">
                                </div>

								<div class="mb-3">
									<label class="form-label fw-semibold text-secondary"><i class="fa-solid fa-layer-group me-2"></i>Tên danh mục <span class="text-danger">*</span></label> 
                                    <input type="text" name="name" th:value="${category.name}" class="form-control bg-light" required>
								</div>

								<div class="mb-3">
									<label class="form-label fw-semibold text-secondary"><i class="fa-solid fa-toggle-on me-2"></i>Trạng thái <span class="text-danger">*</span></label>
									<div class="d-flex gap-4 mt-1">
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" th:checked="${category.isActive==true}" value="true" name="isActive" id="active"> 
                                            <label class="form-check-label text-success fw-medium" for="active">Hoạt động</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="radio" th:checked="${category.isActive==false}" value="false" name="isActive" id="inactive"> 
                                            <label class="form-check-label text-danger fw-medium" for="inactive">Ngừng hoạt động</label>
                                        </div>
                                    </div>
								</div>

								<div class="mb-4">
									<label class="form-label fw-semibold text-secondary"><i class="fa-solid fa-image me-2"></i>Cập nhật ảnh mới (Bỏ qua nếu giữ nguyên)</label> 
                                    <input type="file" name="file" class="form-control bg-light" accept="image/*">
								</div>

								<div class="d-flex justify-content-center gap-3 mt-5 pt-3 border-top">
									<button class="btn btn-primary px-4 py-2 fw-bold text-uppercase shadow-sm rounded-pill">
                                        <i class="fa-solid fa-floppy-disk me-2"></i> Cập nhật
                                    </button>
									<a href="/admin/category" class="btn btn-secondary px-4 py-2 fw-bold text-uppercase shadow-sm rounded-pill">
                                        <i class="fa-solid fa-arrow-left me-2"></i> Quay lại
                                    </a>
								</div>

							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
