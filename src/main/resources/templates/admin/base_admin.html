<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:fragment="layout(content)">
<head>
<meta charset="UTF-8">
<title>Quản trị - ShopPKTH</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
	background-color: #f8f9fc;
	overflow-x: hidden;
}

.fixed-top {
	height: 70px;
}

.admin-sidebar {
	width: 250px;
	position: fixed;
	top: 70px;
	left: 0;
	height: calc(100vh - 70px);
	background: linear-gradient(180deg, #4e73df 10%, #224abe 100%);
	overflow-y: auto;
	z-index: 1000;
	padding-top: 15px;
}

.admin-sidebar .sidebar-heading {
	color: rgba(255, 255, 255, 0.5);
	font-size: 0.75rem;
	text-transform: uppercase;
	font-weight: 800;
	padding: 10px 20px 5px;
}

.admin-sidebar .nav-link-sb {
	display: flex;
	align-items: center;
	padding: 12px 20px;
	color: rgba(255, 255, 255, 0.8);
	text-decoration: none;
	font-weight: 600;
	transition: 0.2s;
}

.admin-sidebar .nav-link-sb i {
	margin-right: 10px;
	font-size: 1.1rem;
	width: 20px;
	text-align: center;
}

.admin-sidebar .nav-link-sb:hover, .admin-sidebar .nav-link-sb.active {
	color: #fff;
	background-color: rgba(255, 255, 255, 0.15);
}

.admin-content {
	margin-left: 250px;
	margin-top: 10px;
	padding: 25px;
	min-height: calc(100vh - 70px);
}

.admin-sidebar .nav-link-sb.active {
	color: #fff !important;
	background-color: rgba(255, 255, 255, 0.2) !important;
	border-left: 4px solid #fff;
	padding-left: 16px;
}
</style>
</head>
<body>

	<header class="main-header">
		<nav class="navbar navbar-expand-lg bg-light shadow-sm fixed-top">
			<div class="container-fluid">
				<a class="navbar-brand fw-bold" href="/" th:href="@{/}">
					<h2>SHOP_PKTH</h2>
				</a>
				<button class="navbar-toggler" type="button"
					data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<li class="nav-item"><a class="nav-link active fw-bold"
							href="/admin/"> <i class="fa-solid fa-house"></i> TRANG QUẢN
								TRỊ
						</a></li>
						<li class="nav-item"><a class="nav-link" href="/">Về
								trang cửa hàng</a></li>
					</ul>
					<ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
						<th:block th:if="${user!=null}">
							<li class="nav-item dropdown"><a
								class="nav-link dropdown-toggle active fw-bold" href="#"
								role="button" data-bs-toggle="dropdown"> <i
									class="fa-solid fa-user-shield text-danger"></i>
									[[${user.name}]]
							</a>
								<ul class="dropdown-menu dropdown-menu-end">
									<li><a class="dropdown-item" href="/admin/profile">Hồ
											sơ Admin</a></li>
									<li><a class="dropdown-item" href="/logout">Đăng xuất</a></li>
								</ul></li>
						</th:block>
					</ul>
				</div>
			</div>
		</nav>
	</header>

	<div class="admin-sidebar shadow">
		<a href="/admin/" class="nav-link-sb active"><i
			class="fa-solid fa-tachometer-alt"></i> Dashboard</a>

		<div class="sidebar-heading mt-3">Quản lý Sản Phẩm</div>
		<a href="/admin/category" class="nav-link-sb"><i
			class="fa-solid fa-folder-plus"></i> Danh Mục</a> <a
			href="/admin/loadAddProduct" class="nav-link-sb"><i
			class="fa-solid fa-square-plus"></i> Thêm Sản Phẩm</a> <a
			href="/admin/products" class="nav-link-sb"><i
			class="fa-solid fa-table-list"></i> Kho Sản Phẩm</a>

		<div class="sidebar-heading mt-3">Quản lý Đơn Hàng</div>
		<a href="/admin/orders" class="nav-link-sb"><i
			class="fa-solid fa-file-invoice-dollar"></i> Xử Lý Đơn Hàng</a>

		<div class="sidebar-heading mt-3">Tài Khoản</div>
		<a href="/admin/users?type=1" class="nav-link-sb"><i
			class="fa-solid fa-users"></i> Khách Hàng</a> <a
			href="/admin/users?type=2" class="nav-link-sb"><i
			class="fa-solid fa-user-shield"></i> Quản Trị Viên</a> <a
			href="/admin/add-admin" class="nav-link-sb"><i
			class="fa-solid fa-user-plus"></i> Thêm Admin</a>
	</div>

	<div class="admin-content">
		<div th:replace="${content}"></div>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			// Lấy đường dẫn + query string (ví dụ: /admin/users?type=1)
			var currentFullUrl = window.location.pathname
					+ window.location.search;

			var navLinks = document
					.querySelectorAll('.admin-sidebar .nav-link-sb');

			navLinks.forEach(function(link) {
				var linkHref = link.getAttribute('href');

				// Xóa class active cũ
				link.classList.remove('active');

				// Logic so sánh:
				// 1. Nếu là Dashboard (trường hợp đặc biệt /admin/)
				if (linkHref === "/admin/" && currentFullUrl === "/admin/") {
					link.classList.add('active');
				}
				// 2. Nếu là các trang khác (bao gồm cả trường hợp có ?type=1)
				else if (linkHref !== "/admin/"
						&& currentFullUrl.startsWith(linkHref)) {
					link.classList.add('active');
				}
			});
		});
	</script>

	<script
		src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
