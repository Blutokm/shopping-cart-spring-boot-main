<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{admin/base_admin::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Bảng điều khiển Quản trị - ShopPKTH</title>
</head>
<body>
	<section class="container-fluid px-4 py-4 mb-5">

		<style>
            .hover-card {
                transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            }
            .hover-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1) !important;
            }
            .icon-shape {
                width: 48px;
                height: 48px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
            }
		</style>

        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
			<div>
                <h3 class="fw-bold text-primary text-uppercase m-0">Thống Kê Tổng Quan</h3>
                <p class="text-muted small mt-1 mb-0">Báo cáo hiệu suất kinh doanh của cửa hàng</p>
            </div>
		</div>

        <div class="row g-4 mb-5">
			<div class="col-xl-3 col-md-6">
				<div class="card shadow-sm border-0 border-start border-primary border-4 h-100 py-2 hover-card rounded-4">
					<div class="card-body px-4">
						<div class="row align-items-center">
							<div class="col me-2">
								<div class="text-xs fw-bold text-primary text-uppercase mb-1" style="font-size: 0.8rem; letter-spacing: 0.5px;">Tổng Doanh Thu</div>
								<div class="h4 mb-0 fw-bold text-dark" th:text="${#numbers.formatDecimal(revenue, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</div>
							</div>
							<div class="col-auto">
								<div class="bg-primary bg-opacity-10 icon-shape">
									<i class="fa-solid fa-sack-dollar fa-lg text-primary"></i>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

            <div class="col-xl-3 col-md-6">
				<div class="card shadow-sm border-0 border-start border-success border-4 h-100 py-2 hover-card rounded-4">
					<div class="card-body px-4">
						<div class="row align-items-center">
							<div class="col me-2">
								<div class="text-xs fw-bold text-success text-uppercase mb-1" style="font-size: 0.8rem; letter-spacing: 0.5px;">Đơn Hàng</div>
								<div class="h4 mb-0 fw-bold text-dark" th:text="${orders}">0</div>
							</div>
							<div class="col-auto">
								<div class="bg-success bg-opacity-10 icon-shape">
									<i class="fa-solid fa-cart-shopping fa-lg text-success"></i>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

            <div class="col-xl-3 col-md-6">
				<div class="card shadow-sm border-0 border-start border-info border-4 h-100 py-2 hover-card rounded-4">
					<div class="card-body px-4">
						<div class="row align-items-center">
							<div class="col me-2">
								<div class="text-xs fw-bold text-info text-uppercase mb-1" style="font-size: 0.8rem; letter-spacing: 0.5px;">Sản Phẩm</div>
								<div class="h4 mb-0 fw-bold text-dark" th:text="${products}">0</div>
							</div>
							<div class="col-auto">
								<div class="bg-info bg-opacity-10 icon-shape">
									<i class="fa-solid fa-box-open fa-lg text-info"></i>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

            <div class="col-xl-3 col-md-6">
				<div class="card shadow-sm border-0 border-start border-warning border-4 h-100 py-2 hover-card rounded-4">
					<div class="card-body px-4">
						<div class="row align-items-center">
							<div class="col me-2">
								<div class="text-xs fw-bold text-warning text-uppercase mb-1" style="font-size: 0.8rem; letter-spacing: 0.5px;">Tài Khoản</div>
								<div class="h4 mb-0 fw-bold text-dark" th:text="${users}">0</div>
							</div>
							<div class="col-auto">
								<div class="bg-warning bg-opacity-10 icon-shape">
									<i class="fa-solid fa-users fa-lg text-warning"></i>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

        <div class="row g-4 mb-4">
            <div class="col-xl-8 col-lg-7">
				<div class="card shadow-sm border-0 rounded-4 h-100">
					<div class="card-header bg-white border-0 pt-4 pb-2">
						<h6 class="fw-bold text-dark m-0">
							<i class="fa-solid fa-chart-line text-primary me-2"></i>Biểu đồ Doanh Thu Năm Nay
						</h6>
					</div>
					<div class="card-body p-4 pt-0">
						<div style="position: relative; height: 350px; width: 100%">
							<canvas id="revenueLineChart"></canvas>
						</div>
					</div>
				</div>
			</div>

            <div class="col-xl-4 col-lg-5">
				<div class="card shadow-sm border-0 rounded-4 h-100">
					<div class="card-header bg-white border-0 pt-4 pb-2">
						<h6 class="fw-bold text-dark m-0">
							<i class="fa-solid fa-chart-pie text-primary me-2"></i>Tỷ trọng Danh mục
						</h6>
					</div>
					<div class="card-body d-flex flex-column justify-content-center p-4">
						<div style="position: relative; height: 280px; width: 100%">
							<canvas id="categoryPieChart"></canvas>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script th:inline="javascript">
			/*<![CDATA[*/
			var revenueLabels = /*[[${chartRevenueLabels}]]*/[ "Tháng 1", "Tháng 2" ];
			var revenueData = /*[[${chartRevenueData}]]*/[ 0, 0 ];

			const vndFormat = new Intl.NumberFormat('vi-VN', {
				style : 'currency',
				currency : 'VND'
			});

			const ctxLine = document.getElementById('revenueLineChart').getContext('2d');

			let gradientFill = ctxLine.createLinearGradient(0, 0, 0, 350);
			gradientFill.addColorStop(0, 'rgba(255, 102, 0, 0.6)'); 
			gradientFill.addColorStop(1, 'rgba(255, 102, 0, 0.02)'); 

			new Chart(ctxLine, {
				type : 'line',
				data : {
					labels : revenueLabels,
					datasets : [ {
						label : "Doanh thu",
						backgroundColor : gradientFill,
						borderColor : "#ff6600", 
						borderWidth : 3,
						pointBackgroundColor : "#fff",
						pointBorderColor : "#ff6600",
						pointBorderWidth : 2,
						pointRadius : 4,
						pointHoverRadius : 6,
						data : revenueData,
						fill : true,
						tension : 0.4 
					} ]
				},
				options : {
					responsive : true,
					maintainAspectRatio : false,
					plugins : {
						legend : {
							display : false
						},
						tooltip : {
							backgroundColor : 'rgba(0,0,0,0.85)',
							padding : 12,
                            cornerRadius: 8,
							titleFont : {
								size : 14,
								family : "'Nunito', sans-serif"
							},
							bodyFont : {
								size : 15,
								weight : 'bold',
								family : "'Nunito', sans-serif"
							},
							callbacks : {
								label : function(context) {
									return ' ' + vndFormat.format(context.parsed.y);
								}
							}
						}
					},
					scales : {
						x : {
							grid : {
								display : false,
								drawBorder : false
							}
						},
						y : {
							beginAtZero : true,
							suggestedMax: 10000000,
							grid : {
								color : "rgba(0, 0, 0, 0.06)",
								drawBorder : false,
								borderDash : [ 5, 5 ] 
							},
							ticks : {
								padding : 10,
								callback : function(value) {
									if (value >= 1000000000) return (value / 1000000000) + ' Tỷ';
									if (value >= 1000000) return (value / 1000000) + ' Tr';
									if (value >= 1000) return (value / 1000) + ' K';
									return value; 
								}
							}
						}
					}
				}
			});

		
			var categoryLabels = /*[[${chartCategoryLabels}]]*/[ "Danh mục" ];
			var categoryData = /*[[${chartCategoryData}]]*/[ 0 ];

			const ctxPie = document.getElementById('categoryPieChart').getContext('2d');
			new Chart(ctxPie, {
				type : 'doughnut',
				data : {
					labels : categoryLabels,
					datasets : [ {
						data : categoryData,
						backgroundColor : [ '#ff6600', '#198754', '#0dcaf0', '#ffc107', '#dc3545', '#6610f2', '#e83e8c', '#fd7e14' ],
						borderWidth : 2,
                        borderColor: '#fff',
						hoverOffset : 5
					} ]
				},
				options : {
					responsive : true,
					maintainAspectRatio : false,
					plugins : {
						legend : {
							position : 'bottom',
							labels : {
								padding : 20,
								usePointStyle : true,
								pointStyle : 'circle',
                                font: {
                                    family: "'Nunito', sans-serif"
                                }
							}
						},
						tooltip : {
                            backgroundColor: 'rgba(0,0,0,0.85)',
                            cornerRadius: 8,
                            padding: 10,
							callbacks : {
								label : function(context) {
									return ' ' + context.label + ': ' + context.parsed + ' SP';
								}
							}
						}
					},
					cutout : '72%'
				}
			});
			/*]]>*/
		</script>
	</section>
</body>
</html>
