<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/base_admin::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Bảng điều khiển Quản trị</title>
</head>
<body>
<section class="container-fluid">

    <p class="text-start fs-3 mt-2">Thống Kê Tổng Quan</p>

    <div class="row g-4 mb-4">
        <div class="col-xl-3 col-md-6">
            <div class="card shadow-sm border-0 border-start border-primary border-4 h-100 py-2">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-primary text-uppercase mb-1" style="font-size: 0.8rem;">Tổng Doanh Thu</div>
                            <div class="h5 mb-0 fw-bold text-dark" th:text="${#numbers.formatDecimal(revenue, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</div>
                        </div>
                        <div class="col-auto"><i class="fa-solid fa-sack-dollar fa-2x text-secondary opacity-50"></i></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card shadow-sm border-0 border-start border-success border-4 h-100 py-2">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-success text-uppercase mb-1" style="font-size: 0.8rem;">Đơn Hàng</div>
                            <div class="h5 mb-0 fw-bold text-dark" th:text="${orders}">0</div>
                        </div>
                        <div class="col-auto"><i class="fa-solid fa-cart-shopping fa-2x text-secondary opacity-50"></i></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card shadow-sm border-0 border-start border-info border-4 h-100 py-2">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-info text-uppercase mb-1" style="font-size: 0.8rem;">Sản Phẩm</div>
                            <div class="h5 mb-0 fw-bold text-dark" th:text="${products}">0</div>
                        </div>
                        <div class="col-auto"><i class="fa-solid fa-box-open fa-2x text-secondary opacity-50"></i></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card shadow-sm border-0 border-start border-warning border-4 h-100 py-2">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col me-2">
                            <div class="text-xs fw-bold text-warning text-uppercase mb-1" style="font-size: 0.8rem;">Người Dùng</div>
                            <div class="h5 mb-0 fw-bold text-dark" th:text="${users}">0</div>
                        </div>
                        <div class="col-auto"><i class="fa-solid fa-users fa-2x text-secondary opacity-50"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-xl-8 col-lg-7">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white fw-bold text-primary py-3">
                    <i class="fa-solid fa-chart-line me-2"></i>Biểu đồ Doanh Thu
                </div>
                <div class="card-body">
                    <div style="position: relative; height:320px; width:100%">
                        <canvas id="revenueLineChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-4 col-lg-5">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white fw-bold text-primary py-3">
                    <i class="fa-solid fa-chart-pie me-2"></i>Cơ cấu Sản Phẩm
                </div>
                <div class="card-body d-flex flex-column justify-content-center">
                    <div style="position: relative; height:240px; width:100%">
                        <canvas id="categoryPieChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        
        // --- DATA BIỂU ĐỒ ĐƯỜNG (DOANH THU) ---
        var revenueLabels = /*[[${chartRevenueLabels}]]*/ ["Tháng 1", "Tháng 2"];
        var revenueData = /*[[${chartRevenueData}]]*/ [0, 0];

        const ctxLine = document.getElementById('revenueLineChart').getContext('2d');
        new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: revenueLabels,
                datasets: [{
                    label: "Doanh thu (VNĐ)",
                    backgroundColor: "rgba(13, 110, 253, 0.1)",
                    borderColor: "#0d6efd",
                    pointBackgroundColor: "#0d6efd",
                    data: revenueData,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // --- DATA BIỂU ĐỒ TRÒN (DANH MỤC) ---
        var categoryLabels = /*[[${chartCategoryLabels}]]*/ ["Danh mục"];
        var categoryData = /*[[${chartCategoryData}]]*/ [0];

        const ctxPie = document.getElementById('categoryPieChart').getContext('2d');
        new Chart(ctxPie, {
            type: 'doughnut',
            data: {
                labels: categoryLabels,
                datasets: [{
                    data: categoryData,
                    backgroundColor: ['#0d6efd', '#198754', '#0dcaf0', '#ffc107', '#dc3545', '#6610f2']
                }]
            },
            options: {
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } },
                cutout: '75%'
            }
        });
        /*]]>*/
    </script>
</section>
</body>
</html>
